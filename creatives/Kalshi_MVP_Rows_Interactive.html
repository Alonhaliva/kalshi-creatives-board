<!DOCTYPE html><html lang="en"><head><script src="mraid.js"></script><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><title>Kalshi — MVP</title>
<style>
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; margin:0; padding:0; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0C0F0E;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif; color:#fff; -webkit-user-select:none; user-select:none; -webkit-font-smoothing:antialiased; }
  #stage{ position:absolute; top:0; left:0; right:0; bottom:0; overflow:hidden; cursor:pointer; background:#013126; max-width:440px; margin:0 auto; touch-action:manipulation;
    display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column; -webkit-box-align:center; -webkit-align-items:center; align-items:center; -webkit-box-pack:start; -webkit-justify-content:flex-start; justify-content:flex-start; }
  #heroWrap{ position:relative; width:100%; -webkit-flex-shrink:0; flex-shrink:0; }
  #hero{ width:100%; height:auto; display:block; -webkit-user-drag:none; }
  .hot{ position:absolute; left:9%; width:82%; height:6.8%; border:0; background:transparent; cursor:pointer; -webkit-appearance:none; appearance:none; border-radius:14px; z-index:3; }
  .hl{ position:absolute; left:8%; width:87%; height:7.4%; border:2px solid #00E896; border-radius:15px; background:rgba(0,232,150,.10);
    box-shadow:0 0 22px rgba(0,232,150,.40), inset 0 0 0 100px rgba(0,232,150,.06); opacity:0; pointer-events:none; z-index:2; -webkit-transition:opacity .18s; transition:opacity .18s; }
  .hl.on{ opacity:1; }
  .hl .chk{ position:absolute; right:2.5%; top:50%; -webkit-transform:translateY(-50%); transform:translateY(-50%); width:24px; height:24px; border-radius:50%; background:#00E896; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .hl .chk:before{ content:""; position:absolute; left:8px; top:6px; width:6px; height:10px; border:solid #04140E; border-width:0 2.4px 2.4px 0; -webkit-transform:rotate(45deg); transform:rotate(45deg); }
  #cta-wrap{ position:absolute; left:0; right:0; bottom:0; width:100%; padding:30px 20px 20px; z-index:4;
    background:-webkit-linear-gradient(top, transparent, #013126 46%); background:linear-gradient(180deg, transparent, #013126 46%);
    display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column; -webkit-box-align:center; -webkit-align-items:center; align-items:center; }
  #conf{ font-size:13px; font-weight:700; color:#9FBBB0; margin:0 0 12px; text-align:center; -webkit-transition:color .2s; transition:color .2s; }
  #conf b{ color:#00E896; }
  #cta{ position:relative; overflow:visible; -webkit-appearance:none; appearance:none; cursor:pointer; width:100%; max-width:360px; border:0; border-radius:16px; padding:16px 28px; font-family:inherit; font-weight:800; font-size:18px; letter-spacing:-.01em; color:#04140E;
    background:-webkit-linear-gradient(top,#16E39C,#00B877); background:linear-gradient(180deg,#16E39C,#00B877);
    box-shadow:0 12px 32px rgba(0,232,150,.4), inset 0 1px 0 rgba(255,255,255,.5);
    -webkit-animation:ctabounce 2.1s ease-in-out infinite; animation:ctabounce 2.1s ease-in-out infinite; }
  #cta:active{ -webkit-transform:scale(.975); transform:scale(.975); }
  @-webkit-keyframes ctabounce{ 0%,100%{ -webkit-transform:translateY(0);} 50%{ -webkit-transform:translateY(-5px);} }
  @keyframes ctabounce{ 0%,100%{ transform:translateY(0); box-shadow:0 12px 32px rgba(0,232,150,.4), inset 0 1px 0 rgba(255,255,255,.5);} 50%{ transform:translateY(-5px); box-shadow:0 18px 44px rgba(0,232,150,.62), inset 0 1px 0 rgba(255,255,255,.5);} }
  #cta.go{ -webkit-animation:none; animation:none; -webkit-transform:scale(1.03); transform:scale(1.03); }
  .cue{ position:absolute; left:50%; margin-left:-17px; top:100%; margin-top:-8px; font-size:32px; line-height:1; pointer-events:none; -webkit-animation:tapbob 1.9s ease-in-out infinite; animation:tapbob 1.9s ease-in-out infinite; }
  @-webkit-keyframes tapbob{ 0%,100%{ -webkit-transform:translateY(0);} 50%{ -webkit-transform:translateY(-5px);} }
  @keyframes tapbob{ 0%,100%{ transform:translateY(0);} 50%{ transform:translateY(-5px);} }
  .stores{ display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-pack:center; justify-content:center; gap:10px; margin:30px 0 0; }
  .store{ -webkit-appearance:none; appearance:none; cursor:pointer; display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-align:center; align-items:center; gap:7px;
    background:#000; border:1px solid rgba(255,255,255,0.45); border-radius:10px; padding:7px 13px; color:#fff; font-family:inherit; -webkit-transition:-webkit-transform .12s; transition:transform .12s; }
  .store:active{ -webkit-transform:scale(.97); transform:scale(.97); }
  .store .sl{ width:20px; height:20px; -webkit-flex-shrink:0; flex-shrink:0; }
  .store .stx{ display:-webkit-box; display:-webkit-flex; display:flex; -webkit-box-orient:vertical; -webkit-flex-direction:column; flex-direction:column; -webkit-box-align:start; align-items:flex-start; line-height:1.04; }
  .store .stx small{ font-size:7.5px; font-weight:600; letter-spacing:.02em; color:#dcdcdc; text-transform:uppercase; }
  .store .stx b{ font-size:14px; font-weight:700; letter-spacing:-.01em; }
  @media (prefers-reduced-motion:reduce){ *{ -webkit-animation:none!important; animation:none!important; -webkit-transition:none!important; transition:none!important; } }
</style>
